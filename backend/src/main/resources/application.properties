spring.application.name=shinpo
spring.profiles.default=dev

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shinpo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shinpo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:shinpo_dev}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# EONPAI AI Configuration (Default: local Ollama; Cloud: Gemini 3.6 Flash)
shinpo.ai.enabled=${SHINPO_AI_ENABLED:true}
shinpo.ai.provider=${SHINPO_AI_PROVIDER:ollama}
shinpo.ai.ollama.base-url=${SHINPO_AI_OLLAMA_BASE_URL:http://localhost:11434}
shinpo.ai.ollama.model=${SHINPO_AI_OLLAMA_MODEL:qwen3:4b}
shinpo.ai.ollama.timeout-seconds=45
shinpo.ai.gemini.api-key=${GEMINI_API_KEY:${SHINPO_AI_GEMINI_API_KEY:}}
shinpo.ai.gemini.model=${SHINPO_AI_GEMINI_MODEL:gemini-2.5-flash}
shinpo.ai.gemini.timeout-seconds=${SHINPO_AI_GEMINI_TIMEOUT_SECONDS:30}

# JWT Security (Must be provided via SHINPO_JWT_SECRET in production)
shinpo.jwt.secret=${SHINPO_JWT_SECRET:}

# Sentinel Process Management & Server-Side Host Scanning (FAIL-CLOSED: strictly false by default)
shinpo.sentinel.server-process-scanning.enabled=${SHINPO_SERVER_PROCESS_SCANNING_ENABLED:false}

# Configurable CORS Allowed Origins (comma-separated, merged with default Tauri origins)
shinpo.security.cors.allowed-origins=${SHINPO_CORS_ALLOWED_ORIGINS:}