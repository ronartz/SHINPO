# ==============================================================================
# SHINPO Production Configuration Profile (prod)
# Cloud deployment hardened configuration: no developer defaults permitted
# ==============================================================================

spring.application.name=shinpo

# Bind to all interfaces inside container / VM behind reverse proxy
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
shinpo.security.rate-limit.trusted-proxies=${SHINPO_TRUSTED_PROXY_CIDRS:}

# PostgreSQL persistent datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/${POSTGRES_DB:shinpo}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:shinpo}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

# HikariCP Connection Pool Optimization for Production
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Sentinel Process Management:
# Strictly DISABLE server-side host process scanning and termination in production.
# Process isolation and focus protection are handled locally on each user's machine by SHINPO Shield.
shinpo.sentinel.server-process-scanning.enabled=false

# Actuator Security:
# Expose only health and info publicly; never expose env, heapdump, or metrics.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# AI Provider Configuration (Default: deterministic fallback mode if no external Ollama/Gemini configured)
shinpo.ai.enabled=${SHINPO_AI_ENABLED:true}
shinpo.ai.provider=${SHINPO_AI_PROVIDER:gemini}
shinpo.ai.ollama.base-url=${SHINPO_AI_OLLAMA_BASE_URL:}
shinpo.ai.ollama.model=${SHINPO_AI_OLLAMA_MODEL:qwen3:4b}
shinpo.ai.ollama.timeout-seconds=${SHINPO_AI_TIMEOUT_SECONDS:30}
shinpo.ai.gemini.api-key=${GEMINI_API_KEY:${SHINPO_AI_GEMINI_API_KEY:}}
shinpo.ai.gemini.model=${SHINPO_AI_GEMINI_MODEL:gemini-3.6-flash}
shinpo.ai.gemini.timeout-seconds=${SHINPO_AI_GEMINI_TIMEOUT_SECONDS:30}

# JWT Secret MUST be injected via SHINPO_JWT_SECRET environment variable (minimum 256 bits)
shinpo.jwt.secret=${SHINPO_JWT_SECRET}

# Configurable CORS Origins
shinpo.security.cors.allowed-origins=${SHINPO_CORS_ALLOWED_ORIGINS:}

