spring.application.name=shinpo-test

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:shinpo_test}?currentSchema=shinpo_test}
spring.datasource.username=${POSTGRES_USER:shinpo}
spring.datasource.password=${POSTGRES_PASSWORD:shinpo_dev}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=shinpo_test

spring.flyway.enabled=true
spring.flyway.schemas=shinpo_test
spring.flyway.default-schema=shinpo_test
spring.flyway.create-schemas=true

shinpo.jwt.secret=shinpo_test_secret_key_minimum_32_characters_for_hmac256_testing_only
