[package]
name = "shinpo-browser-host"
version = "0.1.0"
edition = "2021"
description = "Per-user native messaging bridge for SHINPO Browser Companion"
license = "UNLICENSED"

[lib]
name = "shinpo_browser_host"
path = "src/lib.rs"

[[bin]]
name = "shinpo-browser-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.14"
