[package]
name = "shinpo-shield"
version = "0.1.0"
edition = "2021"

[lib]
name = "shinpo_shield"
path = "src/lib.rs"

[[bin]]
name = "shinpo-shield"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
sysinfo = "0.33"
