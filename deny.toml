# cargo-deny configuration for SHINPO

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # Informational unmaintained crate notices (not exploitable vulnerabilities)
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # Accepted Security Policy Exception:
    # ID: RUSTSEC-2024-0429
    # Crate: glib v0.18.5
    # Title: Unsoundness in Iterator and DoubleEndedIterator impls for glib::VariantStrIter
    # Dependency Path: tauri v2.12.3 -> muda / wry / tao -> gtk v0.18.2 / webkit2gtk v2.0.2 -> glib v0.18.5
    # Upstream Status: glib >=0.20.0 requires gtk >=0.20, blocked upstream by Tauri 2.x Linux windowing layer
    # Reachability: UNREACHABLE. SHINPO codebase uses Tauri serde IPC, never invoking GVariant string iteration
    # Review Date: 2027-02-16 (or upon next Tauri 2.x gtk-rs upgrade)
    "RUSTSEC-2024-0429",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["blessing", "WTFPL"], crate = "sqlcipher-src" },
]

[licenses.private]
ignore = true

