[package]
name = "shinpo-desktop"
version = "1.0.0"
description = "SHINPO Personal Execution Operating System"
authors = ["SHINPO Team"]
edition = "2021"

[lib]
name = "shinpo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
keyring = "=4.2.0"
shinpo-shield = { path = "../../crates/shinpo-shield" }
shinpo-browser-host = { path = "../../crates/shinpo-browser-host" }
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
rusqlite = { version = "0.41", default-features = false, features = ["bundled-sqlcipher"] }
zeroize = "1.8"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5"
unicode-normalization = "0.1.25"
# Used by the cross-platform EONPAI provider and cancellation state.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
