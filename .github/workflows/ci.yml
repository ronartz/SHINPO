name: SHINPO CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop tests and build (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf pkg-config rpm wget
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action revision
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify zero legacy backend residue
        run: ./scripts/check-no-legacy-backend.sh
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Report frontend development dependency audit
        run: |
          echo "=== Full frontend dependency audit (including development tooling) ==="
          npm audit || true
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Browser Companion tests
        run: npm test
        working-directory: browser-extension
      - name: Prepare Tauri embedded resources
        run: node ../scripts/prepare-desktop-bundle.mjs
        working-directory: frontend
      - name: Tauri Rust tests
        run: cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml
      - name: Tauri strict Clippy
        run: cargo clippy --locked --manifest-path frontend/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tauri formatting
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --check
      - name: Build Tauri desktop binary
        run: cargo build --locked --release --manifest-path frontend/src-tauri/Cargo.toml
      - name: Run isolated native SQLCipher smoke test
        run: ./frontend/src-tauri/target/release/shinpo-desktop --smoke-test
      - name: Shield tests and Clippy
        run: |
          cargo test --locked --manifest-path crates/shinpo-shield/Cargo.toml
          cargo clippy --locked --manifest-path crates/shinpo-shield/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/shinpo-shield/Cargo.toml --check
      - name: Browser Host tests and Clippy
        run: |
          cargo test --locked --manifest-path crates/shinpo-browser-host/Cargo.toml
          cargo clippy --locked --manifest-path crates/shinpo-browser-host/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/shinpo-browser-host/Cargo.toml --check

  desktop-windows:
    name: Desktop tests and build (Windows MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action revision
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Confirm MSVC toolchain
        shell: pwsh
        run: |
          rustc -vV
          cargo -V
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio locator vswhere.exe is unavailable" }
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ x64 build tools are unavailable" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "MSVC environment script is unavailable: $vcvars" }
          $vcEnvironment = & $env:ComSpec /d /s /c "call `"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "Failed to initialize the MSVC x64 environment" }
          $msvcPath = $null
          $requiredVariables = @('INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VisualStudioVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH')
          $existingPath = $env:PATH -split ';'
          foreach ($line in $vcEnvironment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ($name -ieq 'PATH') {
                $msvcPath = $value
                $value -split ';' | Where-Object { $_ -and $_ -notin $existingPath } | Add-Content -Path $env:GITHUB_PATH -Encoding utf8
              } elseif ($name -in $requiredVariables) {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
              }
            }
          }
          $clPath = $msvcPath -split ';' | ForEach-Object { Join-Path $_ 'cl.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $clPath) { throw "MSVC compiler cl.exe is unavailable after initializing vcvars64.bat" }
      - name: Install static SQLCipher OpenSSL dependency
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed to install SQLCipher's OpenSSL dependency" }
          $openssl = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static-md'
          $include = Join-Path $openssl 'include'
          $lib = Join-Path $openssl 'lib'
          if (-not (Test-Path (Join-Path $include 'openssl\opensslv.h')) -or -not (Test-Path (Join-Path $lib 'libcrypto.lib'))) {
            throw "The installed OpenSSL headers or x64 static library are missing"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$openssl" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_INCLUDE_DIR=$include" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_LIB_DIR=$lib" -Encoding utf8
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Report frontend development dependency audit
        shell: bash
        run: |
          echo "=== Full frontend dependency audit (including development tooling) ==="
          npm audit || true
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Browser Companion tests
        run: npm test
        working-directory: browser-extension
      - name: Prepare Tauri embedded resources
        run: node ../scripts/prepare-desktop-bundle.mjs
        working-directory: frontend
      - name: Tauri Rust tests
        run: cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml
      - name: Tauri strict Clippy
        run: cargo clippy --locked --manifest-path frontend/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tauri formatting
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --check
      - name: Build Tauri desktop binary
        run: cargo build --locked --release --manifest-path frontend/src-tauri/Cargo.toml
      - name: Run isolated native SQLCipher smoke test
        shell: pwsh
        run: ./frontend/src-tauri/target/release/shinpo-desktop.exe --smoke-test
      - name: Shield tests and Clippy
        run: |
          cargo test --locked --manifest-path crates/shinpo-shield/Cargo.toml
          cargo clippy --locked --manifest-path crates/shinpo-shield/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/shinpo-shield/Cargo.toml --check
      - name: Browser Host tests and Clippy
        run: |
          cargo test --locked --manifest-path crates/shinpo-browser-host/Cargo.toml
          cargo clippy --locked --manifest-path crates/shinpo-browser-host/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/shinpo-browser-host/Cargo.toml --check

  security:
    name: Existing secret and Rust dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Semgrep SAST scan
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/default
            p/secrets
            p/security-audit
        env:
          SEMGREP_RULES: p/default
      - name: Install OSV-Scanner CLI
        run: |
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          echo "d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: OSV-Scanner dependency scan
        run: osv-scanner -r .
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action revision
        with:
          toolchain: 1.99.0
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.16.4 --locked
      - name: Audit Rust dependency lockfiles
        run: |
          cargo audit --deny unsound --file crates/shinpo-shield/Cargo.lock
          cargo audit --deny unsound --file crates/shinpo-browser-host/Cargo.lock
          cargo audit --deny unsound --file frontend/src-tauri/Cargo.lock
      - name: Cargo Deny checks
        run: |
          cargo deny --manifest-path crates/shinpo-shield/Cargo.toml check bans sources
          cargo deny --manifest-path crates/shinpo-browser-host/Cargo.toml check bans sources
