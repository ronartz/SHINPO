name: CI / Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shinpo_test
          POSTGRES_USER: shinpo
          POSTGRES_PASSWORD: shinpo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: backend/pom.xml

    - name: Make Maven wrapper executable
      run: chmod +x mvnw
      working-directory: backend

    - name: Run Backend Tests
      run: ./mvnw -B test
      working-directory: backend
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: shinpo_test
        POSTGRES_USER: shinpo
        POSTGRES_PASSWORD: shinpo_dev
        SHINPO_JWT_SECRET: shinpo_test_secret_key_minimum_32_characters_for_hmac256_testing_only

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci
      working-directory: frontend

    - name: Lint
      run: npm run lint
      working-directory: frontend

    - name: Unit Tests
      run: npm test
      working-directory: frontend

    - name: Build
      run: npm run build
      working-directory: frontend

    - name: Browser Extension Tests
      run: npm test
      working-directory: browser-extension

  rust-shield:
    name: Rust Shield Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run Rust Shield Tests
      run: cargo test
      working-directory: crates/shinpo-shield

    - name: Run Rust Browser Host Tests
      run: cargo test
      working-directory: crates/shinpo-browser-host
