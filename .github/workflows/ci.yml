name: CI / Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shinpo_test
          POSTGRES_USER: shinpo
          POSTGRES_PASSWORD: shinpo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: backend/pom.xml

    - name: Make Maven wrapper executable
      run: chmod +x mvnw
      working-directory: backend

    - name: Run Backend Tests
      run: ./mvnw -B test
      working-directory: backend
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: shinpo_test
        POSTGRES_USER: shinpo
        POSTGRES_PASSWORD: shinpo_dev
        SHINPO_JWT_SECRET: shinpo_test_secret_key_minimum_32_characters_for_hmac256_testing_only

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci
      working-directory: frontend

    - name: Audit locked frontend dependencies
      run: npm audit --audit-level=high
      working-directory: frontend

    - name: Lint
      run: npm run lint
      working-directory: frontend

    - name: Unit Tests
      run: npm test
      working-directory: frontend

    - name: Build
      run: npm run build
      working-directory: frontend

    - name: Browser Extension Tests
      run: npm test
      working-directory: browser-extension

  rust-shield:
    name: Rust Shield Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable at 2026-10-21

    - name: Run Rust Shield Tests
      run: cargo test
      working-directory: crates/shinpo-shield

    - name: Run Rust Browser Host Tests
      run: cargo test
      working-directory: crates/shinpo-browser-host

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Scan repository history for secrets
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: 'false'
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - name: Audit Rust dependency lockfiles
      run: |
        cargo audit --file crates/shinpo-shield/Cargo.lock
        cargo audit --file crates/shinpo-browser-host/Cargo.lock
        cargo audit --file frontend/src-tauri/Cargo.lock
