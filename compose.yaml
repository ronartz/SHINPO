services:
  postgres:
    image: postgres:17
    container_name: shinpo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - shinpo-postgres-data:/var/lib/postgresql/data

volumes:
  shinpo-postgres-data:
